# =================================================================================================
# Configuration for Distributed Tracing with Resilience4j POC
# See docs/CONFIGURATION-GUIDE.md for detailed production guidelines and property explanations.
# =================================================================================================

server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    threads:
      max: 200
    accept-count: 100

spring:
  application:
    name: distributed-tracing-resilience-poc
  profiles:
    active: dev

  # Cache Configuration for Resilience4j Cache pattern
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=300s

  # Jackson Configuration for JSON processing
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# Custom Application Properties
app:
  product:
    code: ECOM-POC
  business:
    unit: customer-experience
  cost:
    center: CC-2025-001
  data:
    classification: internal

  # Security configurations
  security:
    salt: "${APP_SECURITY_SALT:dev-only-salt}"

  # Actuator Security configurations
  actuator:
    username: "${ACTUATOR_USER:actuator}"
    password: "${ACTUATOR_PASSWORD:actuator}"

# OpenTelemetry and Tracing Configuration
management:
  tracing:
    sampling:
      probability: 1.0  # 100% sampling for POC - use lower values in production
  otlp:
    tracing:
      # Read by TracingConfiguration when instantiating OtlpGrpcSpanExporter bean
      endpoint: http://localhost:4317
      compression: gzip
      timeout: 10s
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,ratelimiters,retries,bulkheads,timelimiters,caches,httpexchanges
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always

# Comprehensive Resilience4j Configuration - ALL PATTERNS
resilience4j:

  # Circuit Breaker Configuration
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50        # Open circuit when 50% failure rate
        slow-call-rate-threshold: 50      # Consider slow calls in failure rate
        slow-call-duration-threshold: 2s  # Call is slow if > 2 seconds
        sliding-window-type: count_based   # Use count-based sliding window
        sliding-window-size: 10           # Consider last 10 calls
        minimum-number-of-calls: 5        # Minimum calls before evaluation
        wait-duration-in-open-state: 10s  # Wait 10s before trying half-open
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        event-consumer-buffer-size: 10
        record-exceptions:
          - java.lang.RuntimeException
          - java.util.concurrent.TimeoutException
          - java.net.ConnectException
        ignore-exceptions:
          - java.lang.IllegalArgumentException
    instances:
      lambdaService:
        base-config: default
        failure-rate-threshold: 60
        wait-duration-in-open-state: 15s
      eksService:
        base-config: default
        failure-rate-threshold: 40
        sliding-window-size: 8
        wait-duration-in-open-state: 12s
      databaseService:
        base-config: default
        failure-rate-threshold: 30
        sliding-window-size: 12
        wait-duration-in-open-state: 20s
      combinedService:
        base-config: default
        failure-rate-threshold: 45
        sliding-window-size: 15
        wait-duration-in-open-state: 8s
      basicCircuitBreaker:
        base-config: default
        failure-rate-threshold: 50
        sliding-window-size: 10
        wait-duration-in-open-state: 10s
      multiTypeCB:
        base-config: default
        failure-rate-threshold: 40
      combinedPattern:
        base-config: default
        failure-rate-threshold: 45
      maxResilience:
        base-config: default
        failure-rate-threshold: 30

  # Retry Configuration
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 10s
        retry-exceptions:
          - java.lang.RuntimeException
          - java.util.concurrent.TimeoutException
          - java.net.ConnectException
        ignore-exceptions:
          - java.lang.IllegalArgumentException
    instances:
      lambdaService:
        base-config: default
        max-attempts: 4
        wait-duration: 500ms
        exponential-backoff-multiplier: 1.5
      eksService:
        base-config: default
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2
      databaseService:
        base-config: default
        max-attempts: 2
        wait-duration: 3s
        exponential-backoff-multiplier: 1.2
      combinedService:
        base-config: default
        max-attempts: 3
        wait-duration: 1s
      basicRetry:
        base-config: default
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
      selectiveRetry:
        base-config: default
        max-attempts: 2
      combinedPattern:
        base-config: default
        max-attempts: 3
      maxResilience:
        base-config: default
        max-attempts: 2

  # Rate Limiter Configuration
  ratelimiter:
    configs:
      default:
        limit-refresh-period: 1s
        limit-for-period: 10
        timeout-duration: 0s
        event-consumer-buffer-size: 100
    instances:
      lambdaService:
        base-config: default
        limit-for-period: 15
        timeout-duration: 100ms
      userService:
        base-config: default
        limit-for-period: 20
        timeout-duration: 500ms
      eksService:
        base-config: default
        limit-for-period: 8
        timeout-duration: 200ms
      combinedService:
        base-config: default
        limit-for-period: 5
        timeout-duration: 0s
      basicRateLimiter:
        base-config: default
        limit-for-period: 10
        timeout-duration: 0s
      waitingRateLimiter:
        base-config: default
        limit-for-period: 10
        timeout-duration: 500ms
      combinedPattern:
        base-config: default
        limit-for-period: 8
      maxResilience:
        base-config: default
        limit-for-period: 5

  # Bulkhead Configuration (Semaphore)
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 5
        max-wait-duration: 1s
        event-consumer-buffer-size: 100
    instances:
      eksService:
        base-config: default
        max-concurrent-calls: 3
        max-wait-duration: 2s
      databaseService:
        base-config: default
        max-concurrent-calls: 8
        max-wait-duration: 500ms
      combinedService:
        base-config: default
        max-concurrent-calls: 2
        max-wait-duration: 1s
      semaphoreBulkhead:
        base-config: default
        max-concurrent-calls: 3
        max-wait-duration: 1s
      maxResilience:
        base-config: default
        max-concurrent-calls: 2

  # Thread Pool Bulkhead Configuration
  thread-pool-bulkhead:
    configs:
      default:
        max-thread-pool-size: 4
        core-thread-pool-size: 2
        queue-capacity: 10
        keep-alive-duration: 20s
        event-consumer-buffer-size: 100
    instances:
      combinedService:
        base-config: default
        max-thread-pool-size: 6
        core-thread-pool-size: 3
        queue-capacity: 15
      heavyProcessingService:
        base-config: default
        max-thread-pool-size: 8
        core-thread-pool-size: 4
        queue-capacity: 20
      threadPoolBulkhead:
        base-config: default
        max-thread-pool-size: 4
        core-thread-pool-size: 2
        queue-capacity: 10
      maxResilience:
        base-config: default
        max-thread-pool-size: 6
        core-thread-pool-size: 3
        queue-capacity: 15

  # Time Limiter Configuration
  timelimiter:
    configs:
      default:
        timeout-duration: 3s
        cancel-running-future: true
        event-consumer-buffer-size: 100
    instances:
      databaseService:
        base-config: default
        timeout-duration: 5s
        cancel-running-future: true
      lambdaService:
        base-config: default
        timeout-duration: 2s
      eksService:
        base-config: default
        timeout-duration: 4s
      combinedService:
        base-config: default
        timeout-duration: 6s
      basicTimeLimiter:
        base-config: default
        timeout-duration: 3s
      maxResilience:
        base-config: default
        timeout-duration: 5s

  # Cache Configuration (Resilience4j Cache pattern)
  cache:
    configs:
      default:
        event-consumer-buffer-size: 100
    instances:
      userDataCache:
        event-consumer-buffer-size: 50
      operationCache:
        event-consumer-buffer-size: 100
      combinedCache:
        event-consumer-buffer-size: 75
      demoCache:
        event-consumer-buffer-size: 100
      maxResilienceCache:
        event-consumer-buffer-size: 100

  # Metrics Configuration
  metrics:
    use-legacy-binder: false

# Logging Configuration
logging:
  level:
    root: INFO
    com.example.poc: INFO
    io.github.resilience4j: INFO
    io.opentelemetry: INFO
    org.springframework.web: INFO
    org.springframework.cache: INFO

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 70
        minimum-number-of-calls: 3

logging:
  level:
    com.example.poc: DEBUG
    io.github.resilience4j: DEBUG
    org.springframework.web: DEBUG

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod

app:
  security:
    salt: "${APP_SECURITY_SALT:}"
  actuator:
    username: "${ACTUATOR_USER:}"
    password: "${ACTUATOR_PASSWORD:}"

management:
  tracing:
    sampling:
      probability: 0.1
  endpoints:
    web:
      exposure:
        include: health,info

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 30
        minimum-number-of-calls: 10

logging:
  level:
    com.example.poc: INFO

---
# Test Profile
spring:
  config:
    activate:
      on-profile: test

resilience4j:
  circuitbreaker:
    configs:
      default:
        wait-duration-in-open-state: 1s
  retry:
    configs:
      default:
        wait-duration: 100ms
  ratelimiter:
    configs:
      default:
        limit-for-period: 100

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:0

---
# Virtual Threads Demo Profile (Opt-in)
spring:
  config:
    activate:
      on-profile: virtual
  threads:
    virtual:
      enabled: true
