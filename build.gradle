plugins {
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'com.diffplug.spotless' version '7.2.1'
}

group = 'com.example'
version = '1.0.0'

def detectedJavaVersion = Integer.parseInt(System.getProperty("java.specification.version", "21"))
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(detectedJavaVersion >= 21 ? detectedJavaVersion : 21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('resilience4jVersion', '2.3.0')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Tracing dependencies (versions managed by Spring Boot BOM)
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'io.opentelemetry:opentelemetry-sdk'

    // Resilience4j
    implementation "io.github.resilience4j:resilience4j-spring-boot3:${resilience4jVersion}"
    implementation "io.github.resilience4j:resilience4j-micrometer:${resilience4jVersion}"

    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Preserve method parameter names in bytecode so AOP/tracing can access them reliably
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.compilerArgs += ['-parameters']
}

/** ---- Spotless configuration ---- */
spotless {
    lineEndings 'GIT_ATTRIBUTES_FAST_ALLSAME'
    java {
        googleJavaFormat('2.0.0')
        toggleOffOn()
        trimTrailingWhitespace()
        endWithNewline()
    }
    format('misc') {
        target '**/*.md', '**/.gitignore'
        leadingTabsToSpaces(2)
        trimTrailingWhitespace()
        endWithNewline()
    }
    format('yaml') {
        target '**/*.yml', '**/*.yaml'
        leadingTabsToSpaces(2)
        trimTrailingWhitespace()
        endWithNewline()
    }
}
